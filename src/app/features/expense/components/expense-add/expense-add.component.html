<div class="page page-form">
  <app-module-action-header
    title="Add Expense"
    backLink="/expense"
    [showSave]="true"
    [showReset]="true"
    (save)="onSave()"
    (reset)="onReset()"
  />
  <app-voice-dynamic-form
    [columns]="columns"
    [formValues]="formValues"
    [validationErrors]="validationErrors"
    configureColumnsLink="/expense/columns"
    [hideFormActions]="true"
    (save)="onSave()"
    (resetForm)="onReset()"
  />
</div>
